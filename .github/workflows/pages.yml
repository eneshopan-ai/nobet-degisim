name: Nobet Degisim - GitHub Pages

# main dalına push edilince siteyi yayınlar. Test ve belgeler yayın dışında kalır.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Yayın klasörünü hazırla
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'test' --exclude '*.md' --exclude 'database.rules.json' ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
